<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - EcoAlerta Urbana</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/app.css">
  <script src="../js/datos.js" defer></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>
<body class="auth-body" data-base="" data-modo="recuperar">
  <main class="auth-container">
    <a class="auth-volver" href="login.html" id="volver-login">← Volver a iniciar sesión</a>
    <div class="auth-card">
      <div class="auth-header">
        <img src="../images/LogoEcoAlerta.png" alt="Logotipo de EcoAlerta Urbana" width="60">
        <h1>Recuperar contraseña</h1>
        <p>Te enviaremos un enlace para crear una nueva.</p>
      </div>

      <div id="alert-message" class="alert-message hidden" role="alert"></div>

      <!-- HU-004 paso 1: solicitar el enlace -->
      <form id="form-solicitar" class="auth-form" novalidate>
        <div class="form-group">
          <label for="rec-usuario">Correo electrónico o código de trabajador <span class="required" aria-hidden="true">*</span></label>
          <input type="text" id="rec-usuario" autocomplete="username" required aria-describedby="rec-usuario-error">
          <span class="error-text" id="rec-usuario-error"></span>
        </div>
        <button type="submit" class="boton boton-full">Enviar enlace</button>
      </form>

      <!-- Simulación del correo recibido -->
      <div id="correo-simulado" class="demo-credenciales" hidden>
        <strong>📧 Correo de EcoAlerta (simulación)</strong><br>
        Recibimos una solicitud para cambiar tu contraseña. El enlace vence en 30 minutos.<br>
        <button type="button" class="btn-link" id="abrir-enlace" style="padding-left:0">Abrir el enlace para crear una nueva contraseña →</button>
      </div>

      <!-- HU-004 paso 2: nueva contraseña -->
      <form id="form-nueva" class="auth-form" novalidate hidden>
        <div class="form-group">
          <label for="nueva-pass">Nueva contraseña <span class="required" aria-hidden="true">*</span></label>
          <input type="password" id="nueva-pass" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required aria-describedby="nueva-pass-error">
          <span class="error-text" id="nueva-pass-error"></span>
        </div>
        <div class="form-group">
          <label for="nueva-pass2">Repite la contraseña <span class="required" aria-hidden="true">*</span></label>
          <input type="password" id="nueva-pass2" autocomplete="new-password" required aria-describedby="nueva-pass2-error">
          <span class="error-text" id="nueva-pass2-error"></span>
        </div>
        <button type="submit" class="boton boton-full">Guardar nueva contraseña</button>
      </form>
    </div>
  </main>
</body>
</html>
