<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cierre con evidencia - EcoAlerta Urbana</title>
  <link rel="stylesheet" href="../../css/estilos.css">
  <link rel="stylesheet" href="../../css/app.css">
  <script src="../../js/datos.js" defer></script>
  <script src="../../js/ui.js" defer></script>
  <script src="../../js/cierre.js" defer></script>
</head>
<body class="app-body" data-base="../">
  <!-- HU-035: foto de la zona saneada (Antes / Después) -->
  <main class="app-main" style="max-width:820px">
    <div class="card" id="resumen" style="display:grid;gap:4px"></div>
    <form class="form" id="form-cierre" novalidate style="margin-top:14px">
      <div class="ficha-fotos">
        <figure>
          <img class="ficha-foto" id="foto-antes" alt="Antes: foto enviada por el vecino">
          <figcaption>ANTES (vecino)</figcaption>
        </figure>
        <div class="campo">
          <div class="foto-area" id="area-despues" role="button" tabindex="0" aria-label="Tomar la foto de la zona limpia" aria-describedby="err-despues" style="height:220px">
            <div class="foto-area__vacio" id="vacio-despues"><span data-icono="camera"></span>Tomar foto DESPUÉS</div>
            <img id="prev-despues" alt="Después: zona limpia" hidden>
          </div>
          <input type="file" accept="image/*" capture="environment" id="input-despues" hidden>
          <span class="error-app" id="err-despues"></span>
        </div>
      </div>
      <div class="campo">
        <label for="obs">Observaciones en campo (opcional)</label>
        <textarea id="obs" placeholder="Ej.: se retiró desmonte y se barrió la vereda."></textarea>
      </div>
      <div class="campo">
        <label class="chip-op" style="display:flex"><input type="checkbox" id="conforme" aria-describedby="err-conforme"><span>Confirmo que la zona quedó completamente limpia</span></label>
        <span class="error-app" id="err-conforme"></span>
      </div>
      <div id="alerta" class="alerta alerta-error" role="alert" hidden></div>
      <button type="submit" class="btn btn-primario btn-bloque">Cerrar reporte como resuelto</button>
    </form>
  </main>
</body>
</html>
